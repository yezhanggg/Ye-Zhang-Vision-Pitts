[project]
name = "visionpitts"
version = "0.1.0"
description = "VisionPitts: anti-displacement housing typology matchmaker for the City of Pittsburgh (AI for Housing Hackathon 2026, Track 3)"
authors = [{ name = "Ye Zhang" }]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "libpysal>=4.10",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyproj>=3.6",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "shapely>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "visionpitts"
module-root = "src"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
